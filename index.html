<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="ガボールパッチのペアを探す視覚探索サイト"><title>Gabor Eye</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%}body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#20242a;background:white}button,input,select{font:inherit}button,select{cursor:pointer}.app{width:100%;height:100vh;height:100dvh;display:flex;flex-direction:column;min-height:0;overflow:hidden}.window-strip{height:clamp(12px,4.2vh,38px);border-bottom:1px solid #eeeeee;flex:none}.site-header{height:clamp(45px,7vh,64px);border-bottom:1px solid #eeeeee;display:flex;align-items:center;padding:0 2%;flex:none}.site-header strong{font-size:clamp(16px,1.5vw,21px)}.main-layout{flex:1;min-height:0;display:grid;grid-template-columns:minmax(80px,13%) minmax(0,1fr) minmax(80px,13%);gap:1.7%;padding:clamp(8px,1.5vw,18px) 1.3%}.ad{border:1px solid #eeeeee;border-radius:12px;box-shadow:0 3px 12px rgba(0,0,0,.06);min-height:0;display:flex;flex-direction:column;color:#8c939c;font-size:12px;text-align:center}.ad span{text-align:left;padding:7px}.ad>div{flex:1;display:grid;place-items:center}.game{display:flex;flex-direction:column;min-height:0;min-width:0}.game-header{flex:none;min-height:clamp(92px,14vh,135px);display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:16px;padding:8px 1%}.instructions{font-size:clamp(11px,1vw,14px);line-height:1.45;min-width:0}.instructions strong{font-size:clamp(13px,1.2vw,17px)}.instructions p{margin:5px 0}.warning{color:#5f6870}.game-status{display:flex;flex-direction:column;align-items:flex-end;gap:7px;font-size:clamp(11px,1vw,14px);white-space:nowrap}.game-status button{border:1px solid #aab2bc;border-radius:6px;background:white;padding:6px 12px}.game-status button:hover{background:#edf2f7}#clock{font-weight:750;font-size:clamp(16px,1.5vw,22px);font-variant-numeric:tabular-nums}.field{position:relative;flex:1;min-height:0;border:1px solid #e9e9e9;border-radius:14px;box-shadow:0 5px 20px rgba(0,0,0,.10),0 1px 4px rgba(0,0,0,.04);overflow:hidden;background:#ffffff}#board{display:block;width:100%;height:100%}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:12px;background:rgba(255,255,255,.78);z-index:3}.panel{width:min(100%,350px);max-height:100%;overflow:auto;background:white;border:1px solid #e5e7eb;border-radius:18px;box-shadow:0 12px 36px #0002;padding:clamp(14px,3vw,25px);text-align:center}.panel h1{margin:0;font-size:22px}.panel h2{font-size:21px}.panel p{font-size:12px;line-height:1.5;color:#52606b}.inputs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}.inputs label{display:flex;flex-direction:column;gap:6px;align-items:flex-start;font-size:12px}.inputs select,.inputs input{width:100%;min-width:0;height:40px;border:1px solid #9aa7b2;border-radius:6px;padding:6px;background:white}.primary{width:100%;padding:12px;border:0;border-radius:7px;background:#1e54ad;color:white;font-weight:700}.primary:hover{background:#123e8a}[hidden]{display:none!important}@media(max-width:700px){.window-strip{height:12px}.site-header{height:42px}.main-layout{grid-template-columns:minmax(0,1fr);padding:6px}.ad{display:none}.game-header{min-height:112px;gap:6px;padding:6px 2px}.instructions{font-size:10px}.instructions strong{font-size:12px}.game-status{font-size:10px;gap:5px}.game-status button{padding:5px 7px}#clock{font-size:15px}.warning{font-size:9px}}@media(max-width:420px){.game-header{grid-template-columns:minmax(0,1fr) 105px}.instructions p{margin:3px 0}.game-status{white-space:normal;text-align:right}}@media(max-height:500px){.window-strip{height:7px}.site-header{height:30px}.game-header{min-height:66px}.instructions{font-size:10px}.instructions p{margin:2px 0}.panel{padding:10px}.inputs{margin:8px 0}}


/* Mobile-only header ad: placeholder for a future AdSense unit. */
.mobile-header-ad{display:none}
@media(max-width:700px){
 .window-strip{display:none}
 .site-header{height:68px;gap:12px;padding:6px 10px}
 .site-header strong{flex:none;font-size:15px}
 .field{flex:0 1 auto;height:var(--mobile-board-height,65vh);max-height:100%}
 .mobile-header-ad{display:flex;align-items:center;justify-content:center;flex:1;min-width:0;height:50px;border-radius:10px;background:#fafafa;box-shadow:0 2px 9px rgba(0,0,0,.09);color:#9ba3ae;font-size:11px}
}
</style></head><body><main class="app">
<div class="window-strip" aria-hidden="true"></div>
<header class="site-header"><strong>Gabor Eye</strong><div class="mobile-header-ad" aria-label="スマートフォン用広告枠"><span>広告スペース</span></div></header>
<div class="main-layout"><aside class="ad ad-left" aria-label="左側広告枠"><span>広告</span><div>広告スペース</div></aside>
<section class="game" aria-label="ガボール探索"><div class="game-header"><div class="instructions"><strong>説明・使用方法</strong><p>同じ模様を2つ探し、見つけたペアを交互に見てください。画面のクリックは不要です。</p><p class="warning">注意：目が疲れたり、頭痛・不快感が出たりした場合は中止して休憩してください。視力改善などの医学的効果は保証されません。</p></div><div class="game-status"><button id="settings" type="button">設定変更</button><div>種類 <span id="countDisplay">15種類 / 30個</span></div><div>残り時間 <output id="clock">05:00</output></div></div></div>
<div class="field"><canvas id="board" aria-label="ガボールパッチ探索画像"></canvas><div class="overlay" id="setup"><div class="panel" role="dialog" aria-modal="true" aria-labelledby="setupTitle"><h1 id="setupTitle">初期設定</h1><p>各種類2個ずつ表示します。模様のペアを探してください。</p><div class="inputs"><label>何種類<select id="types"></select></label><label>タイマー（分）<input id="minutes" type="number" min="1" max="180" step="1" value="5" inputmode="numeric"></label></div><button class="primary" id="start" type="button">スタート</button></div></div><div class="overlay" id="finish" hidden><div class="panel"><h2>時間になりました</h2><p>目を休ませましょう。</p><button class="primary" id="again" type="button">もう一度</button></div></div></div></section>
<aside class="ad ad-right" aria-label="右側広告枠"><span>広告</span><div>広告スペース</div></aside></div></main><script>
'use strict';
const $=id=>document.getElementById(id);
const board=$('board'),ctx=board.getContext('2d');

let patterns=[],positions=[],timer=null,endAt=0,running=false,remaining=300,seed=0;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function rng(n){let s=n>>>0;return ()=>{s+=0x6D2B79F5;let t=s;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
// Find consecutively numbered PNG assets (1.png, 2.png, ...) automatically.
const images=[];
let assetCount=0, assetsReady=false;
function loadAsset(n){return new Promise(resolve=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>resolve(null);img.src=`asset/${n}.png`;});}
async function discoverAssets(){
 $('start').disabled=true;$('start').textContent='画像を読み込み中…';
 // Stop at the first missing number; filenames must be consecutive.
 for(let n=1;n<=500;n++){
  const img=await loadAsset(n);if(!img)break;
  images.push(img);assetCount++;img.onload=()=>draw();
 }
 const select=$('types');select.replaceChildren();
 const minimum=assetCount>=5?5:assetCount;
 for(let n=minimum;n<=assetCount;n++){
  const option=document.createElement('option');option.value=n;option.textContent=`${n} 種類`;select.appendChild(option);
 }
 if(!assetCount){$('start').textContent='画像が見つかりません';return;}
 select.value=String(Math.min(15,assetCount));assetsReady=true;
 $('start').disabled=false;$('start').textContent='スタート';
 setupPatterns();draw();
}
function clock(seconds){const n=Math.max(0,Math.ceil(seconds));$('clock').textContent=`${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;}
function setupPatterns(){
 const count=Number($('types').value),r=rng(seed);
 // Use exactly 1.png, 2.png, ... count.png; two copies of each.
 patterns=images.slice(0,count);
 $('countDisplay').textContent=`${count}種類 / ${count*2}個`;
 positions=Array.from({length:count*2},(_,i)=>Math.floor(i/2));
 for(let i=positions.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[positions[i],positions[j]]=[positions[j],positions[i]];}
}
function draw(){
 // On mobile, fit the board itself tightly around the image rows, not just the images.
 const field=board.parentElement;
 const mobile=window.matchMedia('(max-width:700px)').matches;
 if(mobile && positions.length){
   const width=field.clientWidth;
   const columns=Math.min(positions.length,Math.max(2,Math.round(width/95)));
   const rows=Math.ceil(positions.length/columns);
   const target=Math.ceil(rows*(width/columns)*1.02+12);
   const heightValue=target+'px';
   if(field.style.getPropertyValue('--mobile-board-height')!==heightValue)
     field.style.setProperty('--mobile-board-height',heightValue);
 }else if(!mobile){field.style.removeProperty('--mobile-board-height');}
 const rect=board.getBoundingClientRect(),w=rect.width,h=rect.height;if(!w||!h)return;const dpr=Math.min(devicePixelRatio||1,2);board.width=Math.round(w*dpr);board.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#ffffff';ctx.fillRect(0,0,w,h);if(!positions.length)return;
// Adaptive grid: every patch fits, with a small margin and no overlap.
const n=positions.length;let cols=1,best=-Infinity;for(let c=1;c<=n;c++){const rows=Math.ceil(n/c),cellW=w/c,cellH=h/rows,diam=Math.min(cellW,cellH)*.78;const score=diam-Math.abs(cellW-cellH)*.015;if(score>best){best=score;cols=c;}}if(mobile)cols=Math.min(n,Math.max(2,Math.round(w/95)));const rows=Math.ceil(n/cols),cw=w/cols,ch=mobile?Math.min(h/rows,cw*.95):h/rows,size=Math.min(cw,ch)*(mobile?.82:.78),offsetY=mobile?(h-rows*ch)/2:0;for(let i=0;i<n;i++){const x=(i%cols+.5)*cw,y=offsetY+(Math.floor(i/cols)+.5)*ch;const img=patterns[positions[i]];if(img&&img.complete&&img.naturalWidth)ctx.drawImage(img,x-size/2,y-size/2,size,size);}}
function beep(){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const a=new A();a.resume();for(const dt of [0,.25,.5]){const o=a.createOscillator(),g=a.createGain();o.frequency.value=680;g.gain.setValueAtTime(.0001,a.currentTime+dt);g.gain.exponentialRampToValueAtTime(.1,a.currentTime+dt+.02);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+dt+.19);o.connect(g).connect(a.destination);o.start(a.currentTime+dt);o.stop(a.currentTime+dt+.2);}setTimeout(()=>a.close(),1800);}catch(e){console.warn(e);}}
function tick(){if(!running)return;remaining=Math.max(0,(endAt-performance.now())/1000);clock(remaining);if(remaining<=0){running=false;clearInterval(timer);$('finish').hidden=false;beep();}}
function start(){if(!assetsReady)return;const raw=Number($('minutes').value);const minutes=Number.isFinite(raw)?clamp(Math.round(raw),1,180):5;$('minutes').value=minutes;remaining=minutes*60;seed=(Math.random()*0x100000000)>>>0;setupPatterns();draw();$('setup').hidden=true;$('finish').hidden=true;running=true;endAt=performance.now()+remaining*1000;clearInterval(timer);tick();timer=setInterval(tick,200);}
function settings(){running=false;clearInterval(timer);$('finish').hidden=true;$('setup').hidden=false;clock(clamp(Number($('minutes').value)||5,1,180)*60);}
// Mouse wheel changes the dropdown selection, up to the actual asset count.
$('types').addEventListener('wheel',e=>{if(!assetsReady)return;e.preventDefault();$('types').value=clamp(Number($('types').value)+(e.deltaY>0?1:-1),assetCount>=5?5:assetCount,assetCount);$('types').dispatchEvent(new Event('change'));},{passive:false});
$('types').addEventListener('change',()=>{$('countDisplay').textContent=`${$('types').value}種類 / ${Number($('types').value)*2}個`;});
$('minutes').addEventListener('input',()=>{if(!running)clock(clamp(Number($('minutes').value)||5,1,180)*60);});
$('start').addEventListener('click',start);$('settings').addEventListener('click',settings);$('again').addEventListener('click',settings);
window.addEventListener('resize',draw);if(window.ResizeObserver)new ResizeObserver(draw).observe(board);clock(300);draw();discoverAssets();

</script></body></html>
